[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pysentinel-siem"
dynamic = ["version"]
description = "Lightweight single-host SIEM for Windows: Event Log + Sysmon collection, MITRE ATT&CK-mapped detections, alert correlation, and human-confirmed response."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Abhi Katragadda" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "pywin32>=306; sys_platform == 'win32'",
    "Flask>=3.0,<4",
    "PyYAML>=6.0,<7",
    "defusedxml>=0.7.1,<0.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "bandit>=1.9", "pip-audit>=2.7"]

[project.urls]
Homepage = "https://github.com/rackvzz/pysentinel-siem"
Issues = "https://github.com/rackvzz/pysentinel-siem/issues"
Changelog = "https://github.com/rackvzz/pysentinel-siem/blob/master/CHANGELOG.md"

[tool.setuptools]
packages = ["siem", "siem.rules", "dashboard"]

[tool.setuptools.dynamic]
version = { attr = "siem.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["sysmon"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

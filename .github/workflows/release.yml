name: Release

# Two ways to release, both end the same:
#  - push a tag like v1.1.0, or
#  - publish a release from GitHub's web UI with a new v1.1.0 tag.
# Either way this builds the Windows .exe on a clean runner, zips it with the
# docs, and attaches it to the release with a SHA256 checksum and notes from
# CHANGELOG.md. "Run workflow" (workflow_dispatch) does a dry-run build that
# only uploads the zip as a workflow artifact.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

# a UI-published release can fire both events; run them one at a time so the
# second just re-uploads the same files
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt "pyinstaller>=6.10,<7"

      - name: Run tests
        run: pytest

      - name: Check tag matches siem.__version__
        if: github.event_name != 'workflow_dispatch'
        shell: python
        run: |
          import os, sys
          sys.path.insert(0, ".")
          from siem import __version__
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          if tag != __version__:
              sys.exit(f"tag v{tag} doesn't match siem.__version__ {__version__}")

      - name: Build exe
        run: >
          pyinstaller --onefile --windowed --noconfirm --clean
          --name pysentinel-siem
          --manifest packaging/app.manifest
          --uac-admin
          desktop_app.py

      - name: Package zip
        id: pkg
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_EVENT_NAME -ne "workflow_dispatch") { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          $name = "pysentinel-siem-$version-windows"
          New-Item -ItemType Directory -Force release_dist/$name | Out-Null
          Copy-Item dist/pysentinel-siem.exe, LICENSE, packaging/README-FIRST.txt, sysmon/sysmonconfig-export.xml, PRIVACY.md, THIRD_PARTY_NOTICES.md release_dist/$name/
          Compress-Archive -Path release_dist/$name/* -DestinationPath release_dist/$name.zip -Force
          $hash = (Get-FileHash release_dist/$name.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii release_dist/SHA256SUMS.txt
          "name=$name" >> $env:GITHUB_OUTPUT
          "hash=$hash" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: |
            release_dist/${{ steps.pkg.outputs.name }}.zip
            release_dist/SHA256SUMS.txt

      - name: Write release notes from CHANGELOG
        if: github.event_name != 'workflow_dispatch'
        shell: python
        run: |
          import os, re
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## \[{re.escape(version)}\].*?$(.*?)(?=^## \[|\Z)", text, re.M | re.S)
          section = m.group(1).strip() if m else "See CHANGELOG.md."
          name = "${{ steps.pkg.outputs.name }}"
          notes = f"""Standalone Windows build. No Python install required.

          **How to run it**
          1. Download `{name}.zip` below and extract it.
          2. Double-click `pysentinel-siem.exe` and click **Yes** on the admin prompt (needed to read the Security log).
          3. See `README-FIRST.txt` in the zip for optional Sysmon setup.

          **SHA256** (`{name}.zip`): `${{ steps.pkg.outputs.hash }}`
          The .exe isn't code-signed yet, so SmartScreen may warn on first launch.

          ## What's changed
          {section}
          """
          open("release_notes.md", "w", encoding="utf-8").write(notes)

      - name: Publish GitHub Release
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ZIP: release_dist/${{ steps.pkg.outputs.name }}.zip
        run: |
          title="pysentinel-siem $TAG — Windows download"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" release_dist/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --title "$title" --notes-file release_notes.md
          else
            gh release create "$TAG" "$ZIP" release_dist/SHA256SUMS.txt \
              --title "$title" --notes-file release_notes.md --verify-tag
          fi

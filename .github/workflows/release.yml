name: Release

# Two ways to release, both end the same:
#  - push a tag like v1.1.0, or
#  - publish a release from GitHub's web UI with a new v1.1.0 tag.
# Either way this builds the Windows .exe on a clean runner, zips it with the
# docs, and attaches it to the release with a SHA256 checksum and notes from
# CHANGELOG.md. "Run workflow" (workflow_dispatch) does a dry-run build that
# only uploads the zip as a workflow artifact.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

# a UI-published release can fire both events; run them one at a time so the
# second just re-uploads the same files
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt "pyinstaller>=6.10,<7"

      - name: Run tests
        run: pytest

      - name: Check tag matches siem.__version__
        if: github.event_name != 'workflow_dispatch'
        shell: python
        run: |
          import os, sys
          sys.path.insert(0, ".")
          from siem import __version__
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          if tag != __version__:
              sys.exit(f"tag v{tag} doesn't match siem.__version__ {__version__}")

      - name: Write Windows version info
        shell: python
        run: |
          import re, sys
          sys.path.insert(0, ".")
          from siem import __version__
          nums = [int(x) for x in re.findall(r"\d+", __version__)[:3]] + [0]
          nums = (nums + [0, 0, 0, 0])[:4]
          tup = tuple(nums)
          info = f"""VSVersionInfo(
            ffi=FixedFileInfo(filevers={tup}, prodvers={tup}, mask=0x3f, flags=0x0, OS=0x40004, fileType=0x1, subtype=0x0, date=(0, 0)),
            kids=[
              StringFileInfo([StringTable('040904B0', [
                StringStruct('CompanyName', 'Abhi Katragadda'),
                StringStruct('FileDescription', 'pysentinel-siem'),
                StringStruct('FileVersion', '{__version__}'),
                StringStruct('InternalName', 'pysentinel-siem'),
                StringStruct('LegalCopyright', 'Copyright (c) 2026 Abhi Katragadda. MIT License.'),
                StringStruct('OriginalFilename', 'pysentinel-siem.exe'),
                StringStruct('ProductName', 'pysentinel-siem'),
                StringStruct('ProductVersion', '{__version__}')])]),
              VarFileInfo([VarStruct('Translation', [1033, 1200])])
            ]
          )
          """
          open("version_info.txt", "w", encoding="utf-8").write(info)

      - name: Build exe
        run: >
          pyinstaller --onefile --windowed --noconfirm --clean
          --name pysentinel-siem
          --manifest packaging/app.manifest
          --uac-admin
          --icon packaging/pysentinel-siem.ico
          --version-file version_info.txt
          desktop_app.py

      - name: Package zip
        id: pkg
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_EVENT_NAME -ne "workflow_dispatch") { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          $name = "pysentinel-siem-$version-windows"
          New-Item -ItemType Directory -Force release_dist/$name | Out-Null
          Copy-Item dist/pysentinel-siem.exe, LICENSE, packaging/README-FIRST.txt, sysmon/sysmonconfig-export.xml, PRIVACY.md, THIRD_PARTY_NOTICES.md release_dist/$name/
          Compress-Archive -Path release_dist/$name/* -DestinationPath release_dist/$name.zip -Force
          "name=$name" >> $env:GITHUB_OUTPUT
          "version=$($version.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y | Out-Null
          }
          & $iscc /Qp "/DAppVersion=${{ steps.pkg.outputs.version }}" "/DSourceDir=..\release_dist\${{ steps.pkg.outputs.name }}" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Checksums
        id: sums
        shell: pwsh
        run: |
          $setup = "pysentinel-siem-v${{ steps.pkg.outputs.version }}-setup.exe"
          $zip = "${{ steps.pkg.outputs.name }}.zip"
          $lines = foreach ($f in @($setup, $zip)) { "$((Get-FileHash release_dist/$f -Algorithm SHA256).Hash.ToLower())  $f" }
          $lines | Out-File -Encoding ascii release_dist/SHA256SUMS.txt
          Get-Content release_dist/SHA256SUMS.txt
          "setup=$setup" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: |
            release_dist/${{ steps.pkg.outputs.name }}.zip
            release_dist/${{ steps.sums.outputs.setup }}
            release_dist/SHA256SUMS.txt

      - name: Write release notes from CHANGELOG
        if: github.event_name != 'workflow_dispatch'
        shell: python
        run: |
          import os, re
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## \[{re.escape(version)}\].*?$(.*?)(?=^## \[|\Z)", text, re.M | re.S)
          section = m.group(1).strip() if m else "See CHANGELOG.md."
          name = "${{ steps.pkg.outputs.name }}"
          setup = "${{ steps.sums.outputs.setup }}"
          sums = open("release_dist/SHA256SUMS.txt", encoding="ascii").read().strip()
          notes = f"""Windows build. No Python install required.

          **Installer (recommended):** download `{setup}` and run it. It installs for your user only (no admin prompt to install), adds **pysentinel-siem** to the Start Menu so you can open it from Windows search, and can be removed from *Settings → Apps*.

          **Portable:** download `{name}.zip`, extract it anywhere, and double-click `pysentinel-siem.exe`.

          Either way, the app asks for admin when it starts (needed to read the Security log). See `README-FIRST.txt` for optional Sysmon setup.

          **SHA256**
          ```
          {sums}
          ```
          The installer and .exe aren't code-signed yet, so SmartScreen may warn on first launch. Click "More info" → "Run anyway" if the checksum matches.

          ## What's changed
          {section}
          """
          open("release_notes.md", "w", encoding="utf-8").write(notes)

      - name: Publish GitHub Release
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ZIP: release_dist/${{ steps.pkg.outputs.name }}.zip
          SETUP: release_dist/${{ steps.sums.outputs.setup }}
        run: |
          title="pysentinel-siem $TAG — Windows download"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$SETUP" "$ZIP" release_dist/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --title "$title" --notes-file release_notes.md
          else
            gh release create "$TAG" "$SETUP" "$ZIP" release_dist/SHA256SUMS.txt \
              --title "$title" --notes-file release_notes.md --verify-tag
          fi

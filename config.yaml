# pysentinel-siem configuration

# Windows Event Log channels to collect from.
channels:
  - Security
  - System
  - Microsoft-Windows-Sysmon/Operational
  # Needed for powershell_scriptblock's detection (event 4104). The
  # channel itself always exists; it only actually emits 4104 once Script
  # Block Logging is turned on (off by default) -- see README's "Detection
  # setup" section for the one-line registry command to enable it. No
  # harm leaving this channel listed even if that policy isn't on yet:
  # it just won't produce any events until it is.
  - Microsoft-Windows-PowerShell/Operational

# How often the collector polls each channel, in seconds.
poll_interval_seconds: 5

# SQLite database file (relative to project root).
db_path: siem.db

detections:
  brute_force:
    enabled: true
    failed_logon_event_id: 4625
    threshold: 5
    window_seconds: 300
  new_admin_account:
    enabled: true
    event_ids: [4720, 4732]
  afterhours_logon:
    enabled: true
    successful_logon_event_id: 4624
    # Hours are UTC (all timestamps in this project are stored in UTC).
    business_hours_start: 7
    business_hours_end: 19
  # The two rules below read Sysmon process-creation events (event ID 1
  # on Microsoft-Windows-Sysmon/Operational).
  encoded_powershell:
    enabled: true
  suspicious_parent_child:
    enabled: true
  threat_intel_match:
    enabled: true
  # Watches for many distinct local ports blocked from the same remote IP
  # in a short window -- a port scan (nmap etc.) signature. Requires
  # Windows' "Filtering Platform Connection" audit policy (failure) to be
  # enabled -- the collector turns this on automatically at startup (see
  # siem/audit_policy.py) when this rule is enabled, no manual setup step.
  port_scan_detection:
    enabled: true
    distinct_ports_threshold: 10
    window_seconds: 30
  # Reads Microsoft-Windows-PowerShell/Operational event 4104 (Script
  # Block Logging) -- requires a registry policy that's off by default,
  # see README's "Detection setup" section. Complements
  # encoded_powershell (which only sees the literal -enc flag on the
  # process command line): this sees the actual script content PowerShell
  # ran, including content a first-stage payload decoded/reconstructed at
  # runtime.
  powershell_scriptblock:
    enabled: true
  # Sysmon ProcessAccess (event 10) targeting lsass.exe with memory-read
  # rights -- the capability every LSASS credential-dumping technique
  # needs. Requires sysmonconfig-export.xml's ProcessAccess RuleGroup to
  # include lsass.exe (already does in this repo's config; re-apply it
  # with `Sysmon64.exe -c sysmonconfig-export.xml` if you installed
  # Sysmon before this rule was added).
  credential_access:
    enabled: true
  # New scheduled task (Security 4698) or new service (System 7045).
  # 4698 needs the "Other Object Access Events" audit subcategory
  # (success) -- the collector turns it on automatically at startup (see
  # siem/audit_policy.py) when this rule is enabled, same as
  # port_scan_detection's audit policy. 7045 needs nothing extra.
  persistence:
    enabled: true

# Keeps the local database from growing unbounded. Raw events are
# high-volume and low long-term value; alerts are the valuable distilled
# output, so they're kept much longer by default.
retention:
  enabled: true
  events_retention_days: 30
  alerts_retention_days: 365
  check_interval_hours: 24

# Cross-references observed IPs against abuse.ch ThreatFox. Disabled by
# default since it needs a free Auth-Key -- see secrets.yaml.example.
threat_intel:
  enabled: false
  refresh_interval_hours: 24
  lookback_days: 3

# Desktop app UI preferences. Normally managed via the Settings tab
# (which writes to user_settings.yaml, not this file) -- this default
# only matters the very first time the app runs, before any
# user_settings.yaml exists. "timezone" only affects display in the
# events/alerts tables -- storage and business-hours comparisons always
# stay UTC regardless of this setting.
ui:
  theme: light
  timezone: UTC

# Periodically scans this machine's own current state (not streaming
# events) for attack-surface issues -- currently just exposed/listening
# ports. Findings appear in the Posture tab, replaced fresh on each scan.
posture:
  enabled: true
  scan_interval_hours: 24

# Native Windows notification (Action Center toast) fired when an alert at
# or above min_severity is raised -- see siem/notifier.py. min_severity is
# one of low/medium/high.
notifications:
  enabled: true
  min_severity: high

# Chains independently-firing alerts from the same user/source IP into one
# higher-confidence "correlated" alert when min_signals distinct rules
# fire for that actor within window_minutes -- see siem/correlation.py.
correlation:
  enabled: true
  window_minutes: 15
  min_signals: 2
